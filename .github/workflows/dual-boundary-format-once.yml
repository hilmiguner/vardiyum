name: Temporary dual-boundary code formatter
on:
  push:
    branches:
      - feat/dual-boundary-break-reconciliation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only touched TypeScript and Node tests
        run: |
          npx prettier --write src/domain/dual-boundary-break-audit.ts src/domain/dual-boundary-break-store.ts src/domain/custom-mixed-hourly-work.ts src/domain/custom-hourly-work-estimate.ts src/domain/custom-hourly-work-store.ts src/data/dual-boundary-break-repository.ts src/components/dual-boundary-break-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/dual-boundary-break-reconciliation.test.mjs
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/dual-boundary-break-audit.ts src/domain/dual-boundary-break-store.ts src/domain/custom-mixed-hourly-work.ts src/domain/custom-hourly-work-estimate.ts src/domain/custom-hourly-work-store.ts src/data/dual-boundary-break-repository.ts src/components/dual-boundary-break-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/dual-boundary-break-reconciliation.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: canonical dual-boundary audit formatting"
            git push
          fi
