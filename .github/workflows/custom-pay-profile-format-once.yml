name: Temporary formatter for custom pay-profile preview
on:
  push:
    branches:
      - feat/custom-pay-profile-transition-preview
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/custom-pay-profile-preview-panel.tsx src/domain/custom-pay-profile-policy.ts src/domain/custom-pay-profile-preview-store.ts tests/custom-pay-profile-policy.test.mjs
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/custom-pay-profile-preview-panel.tsx src/domain/custom-pay-profile-policy.ts src/domain/custom-pay-profile-preview-store.ts tests/custom-pay-profile-policy.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format custom pay profile policy sources"
            git push
          fi
