name: Temporary custom combined formatter
on:
  push:
    branches:
      - feat/custom-pay-period-combined-estimate
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format scoped combined-pay sources
        run: |
          npx prettier --write src/domain/custom-pay-combined.ts src/domain/custom-pay-combined-store.ts src/data/custom-pay-combined-repository.ts src/domain/custom-fixed-overtime-store.ts src/components/custom-pay-combined-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/custom-pay-combined.test.mjs
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/custom-pay-combined.ts src/domain/custom-pay-combined-store.ts src/data/custom-pay-combined-repository.ts src/domain/custom-fixed-overtime-store.ts src/components/custom-pay-combined-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/custom-pay-combined.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format combined custom pay estimate and regressions"
            git push
          fi
