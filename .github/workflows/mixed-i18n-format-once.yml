name: Temporary mixed i18n formatter
on:
  push:
    branches:
      - feat/custom-mixed-hourly-rates
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/i18n/index.ts
      - name: Commit formatted i18n
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format mixed hourly translations"
            git push
          fi
