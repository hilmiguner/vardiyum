name: Temporary Prettier custom pay-break source
on:
  push:
    branches:
      - feat/pay-period-break-audit-v8
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/custom-pay-break-panel.tsx src/domain/custom-pay-break-audit.ts src/i18n/index.ts tests/custom-pay-break-audit.test.mjs
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/custom-pay-break-panel.tsx src/domain/custom-pay-break-audit.ts src/i18n/index.ts tests/custom-pay-break-audit.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format custom pay-break audit files"
            git push
          fi
