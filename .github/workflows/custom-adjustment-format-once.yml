name: Temporary custom adjustment formatter
on:
  push:
    branches:
      - feat/custom-period-adjustment-attribution
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Canonical formatting for custom adjustment sources and tests
        run: |
          npx prettier --write src/domain/custom-adjustment-attribution.ts src/domain/custom-adjustment-attribution-store.ts src/data/custom-adjustment-attribution-repository.ts src/components/custom-adjustment-attribution-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/custom-adjustment-attribution.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/custom-adjustment-attribution.ts src/domain/custom-adjustment-attribution-store.ts src/data/custom-adjustment-attribution-repository.ts src/components/custom-adjustment-attribution-panel.tsx 'src/app/(tabs)/earnings.tsx' src/i18n/index.ts tests/custom-adjustment-attribution.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format exact adjustment split and source audit"
            git push
          fi
