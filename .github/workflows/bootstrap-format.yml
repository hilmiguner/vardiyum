name: Format tracked source files (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/expo-mobile-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format project code
        run: npm run format:write
      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests package.json app.json tsconfig.json eslint.config.js .github/workflows/mobile-quality.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: format Expo app source with Prettier'
            git push origin HEAD:refs/heads/feat/expo-mobile-foundation
          fi
