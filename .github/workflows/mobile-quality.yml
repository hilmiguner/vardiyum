name: Mobile quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Temporary Prettier diff diagnostic (remove after copying)
        run: |
          npm run format:write
          echo BEGIN_PRETTIER_DIFF
          git --no-pager diff -- src/components/today-earnings-panel.tsx src/i18n/index.ts
          echo END_PRETTIER_DIFF
      - name: Code formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist/ios
