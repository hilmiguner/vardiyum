name: Mobile quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Temporary format diagnosis
        run: |
          npm run format:write
          node -e "const fs=require('fs'); for(const p of ['src/components/two-fixed-overtime-policy-panel.tsx','src/domain/two-fixed-overtime-policy.ts','src/domain/two-fixed-overtime-store.ts','src/i18n/index.ts','tests/two-fixed-overtime-policy.test.mjs'])console.log('FMTFILE:'+JSON.stringify({path:p,content:fs.readFileSync(p,'utf8')}));"
      - name: Code formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist/ios
