name: Mobile quality

# Temporarily paused on the MVP QA branch until 2026-12-01.
# Keep every quality job available for local parity and December reactivation.
# On December 1 restore the original pull_request + main-push triggers
# in ONE commit, run PR CI once, verify result, then merge with approval.
on:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Code formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Domain unit tests
        run: npm test
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir dist/ios
