name: Temporary final dual i18n Prettier
on:
  push:
    branches:
      - feat/dual-boundary-break-reconciliation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/i18n/index.ts src/components/custom-hourly-estimate-panel.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/index.ts src/components/custom-hourly-estimate-panel.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize dual break labels"
            git push
          fi
