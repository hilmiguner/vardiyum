name: Format Issue 22 code (temporary)
on:
  push:
    branches:
      - feat/configurable-pay-period-domain
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/pay-period.ts tests/pay-period.test.mjs
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/pay-period.ts tests/pay-period.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format configurable pay period files"
            git push
          fi
