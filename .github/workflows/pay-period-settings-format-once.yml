name: Format pay-period settings test (temporary)
on:
  push:
    branches:
      - feat/pay-period-persisted-setting
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'hilmiguner/vardiyum'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/pay-period-settings.test.mjs
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pay-period-settings.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format pay-period settings test"
            git push
          fi
